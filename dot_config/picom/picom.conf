# picom (コンポジタ): 影・フェード・角丸・すりガラス
# すりガラス (ぼかし) をかけるのは Awesome が出すもの (バー・Dock・ポップアップ・通知・メニュー・ツールチップ・選択パネル)
# と Ghostty だけ

backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 0.9;
corner-radius = 8;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

blur: {
  method = "dual_kawase";
  strength = 6;
};

rules: ({
  # ツールチップはフェードしない (透け具合は Awesome 側のすりガラスの色で決める)
  match = "window_type = 'tooltip'";
  fade = false;
}, {
  # バー・デスクトップは自分で形を決めるので角丸にしない
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # ぼかしは下で指定したものだけ
  match = "class_g != 'awesome'";
  blur-background = false;
}, {
  # Awesome が出すもの: ぼかす。形 (角丸) は Awesome 側で決めているので picom では丸めない
  match = "class_g = 'awesome'";
  blur-background = true;
  corner-radius = 0;
}, {
  # バー・Dock (type=dock) は影を付けない
  match = "class_g = 'awesome' && window_type = 'dock'";
  shadow = false;
}, {
  match = "class_g = 'com.mitchellh.ghostty'";
  blur-background = true;
}, {
  # 通知や GTK の影付きウィンドウには、picom の影を重ねない
  match = "name = 'Notification' || _GTK_FRAME_EXTENTS@";
  shadow = false;
});
