# picom (コンポジタ): 影・フェード・角丸・すりガラス
# すりガラス (ぼかし) をかけるのは Awesome のバー・Dock と Ghostty だけ

backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 0.9;
corner-radius = 8;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

blur: {
  method = "dual_kawase";
  strength = 6;
};

rules: ({
  # ツールチップは少し透かす (フェードはしない)
  match = "window_type = 'tooltip'";
  fade = false;
  opacity = 0.75;
}, {
  # バー・デスクトップは自分で形を決めるので角丸にしない
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # ぼかしは下の 2 つだけ
  match = "class_g != 'awesome' || window_type != 'dock'";
  blur-background = false;
}, {
  # Awesome のバー・Dock (type=dock): ぼかす、影は付けない
  match = "class_g = 'awesome' && window_type = 'dock'";
  blur-background = true;
  shadow = false;
}, {
  match = "class_g = 'com.mitchellh.ghostty'";
  blur-background = true;
}, {
  # 通知や GTK の影付きウィンドウには、picom の影を重ねない
  match = "name = 'Notification' || _GTK_FRAME_EXTENTS@";
  shadow = false;
});
