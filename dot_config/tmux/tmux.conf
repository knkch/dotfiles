# tmux の設定 (再読み込み: Ctrl+b → r)
#
# よく使うキー (Ctrl+b を押してから)
#   |  左右に分割      -  上下に分割      c  新しいウィンドウ (タブ)
#   g  lazygit        t  btop           y  yazi (ファイル操作)   ※ポップアップで開く
#   r  設定を再読み込み   [  スクロール・コピーモード (v で選択開始、y でコピー)
#   h/j/k/l  ペーンを移動   H/J/K/L  ペーンの大きさを変える (続けて押せる)
# プレフィックスなしで
#   Alt+矢印     ペインを移動      Shift+←/→  ウィンドウ (タブ) を切り替え
#   マウス       クリックで選択、境界をドラッグで大きさ変更、ドラッグで選択するとクリップボードへコピー
#                (tmux を通さず端末側で選択したいときは Shift を押しながらドラッグ)

#################################################### 基本
# シェルは zsh を使う (入っていなければ今まで通り)
if-shell 'test -x /usr/bin/zsh' 'set -g default-shell /usr/bin/zsh'

# ウィンドウ/タブのタイトルを tmux から設定する（例: main:claude - 作業中の内容）
set -g set-titles on
set -g set-titles-string "#S:#W - #T"

# 色をそのまま (24bit カラー) 表示する
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

set -sg escape-time 10          # Esc の反応を速く (nvim 用)
set -g history-limit 50000      # 遡れる行数
set -g focus-events on
set -g mouse on
set -g base-index 1             # ウィンドウ番号を 1 から
setw -g pane-base-index 1
set -g renumber-windows on      # ウィンドウを閉じたら番号を詰める
set -g set-clipboard on

#################################################### キー操作
bind r source-file ~/.config/tmux/tmux.conf \; display-message "設定を再読み込みしました"

# 分割・新規ウィンドウは今いるディレクトリで開く
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim 風: Ctrl+b → h/j/k/l でペーン移動、H/J/K/L (押し続けて連打可) で大きさ変更
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n S-Left  previous-window
bind -n S-Right next-window

# ポップアップで開くツール
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind t display-popup -E -w 90% -h 90% btop
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi

# コピーモードは vi 風。選択したらクリップボード (xclip) へ
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

#################################################### 見た目 (Catppuccin Mocha)
# 色: base #1e1e2e / surface #313244 / overlay #45475a / text #cdd6f4 / subtext #a6adc8
#     blue #89b4fa / mauve #cba6f7 / red #f38ba8 / crust #11111b
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# 左: セッション名 (Ctrl+b を押している間は赤くなる)
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#cba6f7}]#[bg=#{?client_prefix,#f38ba8,#cba6f7},fg=#11111b,bold]  #S #[bg=default,fg=#{?client_prefix,#f38ba8,#cba6f7}] "

# ウィンドウのタブ: 選択中は青、それ以外は灰色。ズーム中は虫眼鏡アイコンを付ける
set -g window-status-separator " "
set -g window-status-format "#[fg=#313244]#[bg=#313244,fg=#a6adc8] #I #W#{?window_zoomed_flag, \U000F004C,} #[bg=default,fg=#313244]"
set -g window-status-current-format "#[fg=#89b4fa]#[bg=#89b4fa,fg=#11111b,bold] #I #W#{?window_zoomed_flag, \U000F004C,} #[bg=default,fg=#89b4fa]"

# 右: 今のペインで動いているコマンドとディレクトリ
set -g status-right "#[fg=#a6adc8] #{pane_current_command}  #[fg=#89b4fa] #{b:pane_current_path} "

# ペインの境界線・メッセージ・選択範囲
set -g pane-border-lines single
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#cba6f7"
setw -g clock-mode-colour "#89b4fa"
